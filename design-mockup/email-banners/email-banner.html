<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800;900&family=JetBrains+Mono:wght@500&display=block" rel="stylesheet">
<style>
:root{--primary:#ff5d22;--yellow:#FBB040;--black:#121723;--muted:#959CB1;--line:#353943}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:400px;overflow:hidden;background:var(--black);font-family:Inter,system-ui,sans-serif}
.b{position:relative;width:1200px;height:400px;overflow:hidden;
 background:radial-gradient(600px 420px at 1010px 120px,rgba(255,93,34,.30),transparent 70%),
            radial-gradient(420px 300px at 1150px 390px,rgba(251,176,64,.22),transparent 70%),var(--black)}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:40px 40px;
 -webkit-mask-image:linear-gradient(90deg,transparent 30%,#000 75%)}
.bar{position:absolute;left:0;top:0;bottom:0;width:10px;background:linear-gradient(180deg,var(--primary),#ff7a3d 45%,var(--yellow))}
.c{position:absolute;left:74px;top:52px;width:720px}
.logo{height:92px;display:block;margin-left:-6px}
h1{margin-top:26px;font-size:56px;line-height:1.04;font-weight:900;letter-spacing:-.025em;color:#fff}
h1 em{font-style:normal;background:linear-gradient(120deg,var(--primary),#ff7a3d 45%,var(--yellow));-webkit-background-clip:text;color:transparent}
.tags{margin-top:26px;display:flex;gap:10px}
.tags span{font-size:16px;font-weight:500;color:#d7dbe6;padding:7px 15px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.03)}
.url{position:absolute;right:56px;bottom:40px;font:500 18px "JetBrains Mono",monospace;color:#fff;display:flex;align-items:center;gap:10px}
.url i{width:9px;height:9px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 5px rgba(34,197,94,.18)}
svg.t{position:absolute;right:0;top:0}
</style></head><body><div class="b">
<div class="grid"></div><div class="bar"></div>
<svg class="t" width="460" height="400" viewBox="0 0 460 400" fill="none">
 <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff5d22"/><stop offset="1" stop-color="#FBB040"/></linearGradient></defs>
 <g stroke="url(#g)" stroke-width="3" stroke-linecap="round" opacity=".9">
  <path d="M120 70 H250 L290 110 H460"/><path d="M180 130 H300 L330 160 H460" opacity=".7"/>
  <path d="M60 200 H220 L260 240 H460" opacity=".55"/><path d="M200 280 H330 L350 300 H460" opacity=".4"/>
  <path d="M370 0 V40 L400 70 V110" opacity=".6"/>
 </g>
 <g fill="#121723" stroke="url(#g)" stroke-width="3">
  <circle cx="120" cy="70" r="8"/><circle cx="180" cy="130" r="8" opacity=".8"/><circle cx="60" cy="200" r="8" opacity=".6"/>
  <circle cx="200" cy="280" r="8" opacity=".45"/><circle cx="400" cy="110" r="8" opacity=".7"/>
 </g>
</svg>
<div class="c">
 <img class="logo" src="logo@4x.png">
 <h1>Engineering Africa&rsquo;s<br><em>Digital Future</em></h1>
 <div class="tags"><span>Bespoke Software</span><span>Practical AI</span><span>Cloud</span><span>Mobile &amp; Web</span><span>IoT</span></div>
</div>
<div class="url"><i></i>theparse.co.za</div>
</div></body></html>
